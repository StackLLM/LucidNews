services:
  lucidnews:
    build:
      context: .
      # args:
      #   EXTRAS: trafilatura  # comma-separated optional extras, e.g. "twitter"
    container_name: lucidnews
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
    restart: "no"
    # Run daily at 8:00 AM UTC (adjust as needed)
    # For one-time run, use: docker compose run --rm lucidnews
    command: ["--hours", "24"]
